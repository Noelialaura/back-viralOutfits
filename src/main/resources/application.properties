spring.application.name=e-commerce

# 1. Configuración de la Fuente de Datos 
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db3?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# 2. Driver específico (Cuidado aquí: si usas MySQL, NO menciones a H2)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. JWT
# JwtService las lee con @Value: si faltan, la app no arranca ("Could not resolve placeholder").
# La clave necesita al menos 32 caracteres porque el token se firma con HMAC-SHA256.
jwt.secret=clave-secreta-uade-ecommerce-grupo6-jueves-noche-2025
jwt.expiration-ms=86400000
